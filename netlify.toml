[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,NODE_ENV,CORS_ORIGIN,JWT_EXPIRES_IN,JWT_SECRET,MONGODB_URI"

[[redirects]]
  from = "/api/*"
  to = "https://athiveera-mfi.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
